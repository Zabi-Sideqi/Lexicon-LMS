'@ | ConvertFrom-Json

          $existing = @{}
          gh issue list --repo $repo --state all --limit 100 --json number,title |
            ConvertFrom-Json |
            ForEach-Object { $existing[$_.title] = [int]$_.number }

          foreach ($task in $tasks) {
            $title = "[$($task.size)] $($task.title)"
            $parent = [int]$task.parent
            $body = @"
## Parent

$($task.us)

## Task

$($task.description)

## User story

$($task.userStory)

## Acceptance Criteria

$((($task.acceptanceCriteria | ForEach-Object { "- [ ] $_" }) -join "`n"))

## Test Scenarios

$((($task.testScenarios | ForEach-Object { "- [ ] $_" }) -join "`n"))

## Size

$($task.size)

## Sprint

$($task.sprint)

## GitHub workflow

Create a feature branch, implement the task, open a PR to `development`, request review from another teammate, handle review comments, and merge only after approval.
"@

            if ($existing.ContainsKey($title)) {
              $number = [int]$existing[$title]
              Write-Host "Already exists: #$number $title"
              gh issue edit $number --repo $repo --parent $parent
            } else {
              $url = gh issue create --repo $repo --title $title --body $body --parent $parent --project "Lexicon LMS"
              Write-Host "Created: $url"
              if ($url -match '/issues/(\d+)$') { $number = [int]$Matches[1]; $existing[$title] = $number }
            }
          }

          Write-Host "DONE: all US01-US17 tasks were created/linked as sub-issues and added to Lexicon LMS project."

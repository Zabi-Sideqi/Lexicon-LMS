name: Create Lexicon LMS sub-issues

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  create-subissues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create and link all LMS task sub-issues
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $repo = "${{ github.repository }}"
          $tasks = Get-Content ".github/lexicon-lms-tasks.json" -Raw | ConvertFrom-Json

          $issues = gh issue list --repo $repo --state all --limit 100 --json number,title | ConvertFrom-Json
          $byTitle = @{}
          foreach ($issue in $issues) {
            $byTitle[$issue.title] = [int]$issue.number
          }

          $created = 0
          $linked = 0

          foreach ($task in $tasks) {
            if ($byTitle.ContainsKey($task.title)) {
              $child = [int]$byTitle[$task.title]
              gh issue edit $child --repo $repo --parent $task.parent
              if ($LASTEXITCODE -ne 0) {
                throw "Could not set parent #$($task.parent) for existing issue #$child."
              }
              $linked++
              Write-Host "Linked #$child -> #$($task.parent)"
            }
            else {
              $url = gh issue create --repo $repo --title $task.title --body $task.body --parent $task.parent
              if ($LASTEXITCODE -ne 0) {
                throw "Could not create sub-issue '$($task.title)'."
              }
              $created++
              Write-Host "Created: $url"
            }
          }

          Write-Host "DONE - Created: $created | Linked: $linked | Total tasks: $($tasks.Count)"

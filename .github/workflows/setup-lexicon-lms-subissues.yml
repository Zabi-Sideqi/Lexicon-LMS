name: Setup Lexicon LMS sub-issues

on:
  push:
    branches: [development]

permissions:
  contents: read
  issues: write

jobs:
  setup-sub-issues:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: Zabi-Sideqi/Lexicon-LMS
    steps:
      - name: Create and link LMS task sub-issues
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          gh auth status
          $repo = $env:REPO

          # Existing US00 tasks are already ordinary issues #19-#23. Link them under US00 (#1).
          gh issue edit 1 --repo $repo --add-sub-issue 19,20,21,22,23

          $tasks = @'
